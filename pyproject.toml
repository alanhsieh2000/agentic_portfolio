[project]
name = "agentic-portfolio"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aisuite>=0.1.6",
    "crewai[anthropic,azure-ai-inference,google-genai,tools]>=1.15.18",
    "duckdb>=1.5.2",
    "exa-py>=2.13.0",
    "markdown>=3.10.2",
    "matplotlib>=3.10.9",
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "parsel>=1.11.0",
    "pydantic[email,timezone]>=2.12.5",
    "pydantic-settings>=2.14.2",
    "pyportfolioopt>=1.6.0",
    "pytest>=9.0.3",
    "python-dotenv>=1.2.2",
    "questionary>=2.1.1",
    "redis>=7.4.0",
    "regex>=2026.1.15",
    "requests>=2.34.2",
    "seaborn>=0.13.2",
    "stockstats>=0.6.8",
    "yfinance>=1.3.0",
]

[project.scripts]
portfolio = "agentic_portfolio.flow.cli:main"
portfolio-backtest = "agentic_portfolio.flow.backtest:main"
portfolio-build-membership = "agentic_portfolio.dataset.membership:main"
portfolio-build-prices = "agentic_portfolio.dataset.prices:main"
portfolio-build-fundamentals = "agentic_portfolio.dataset.fundamentals:main"
portfolio-build-momentum = "agentic_portfolio.dataset.momentum:main"
portfolio-build-returns = "agentic_portfolio.dataset.returns:main"
portfolio-build-dividends = "agentic_portfolio.dataset.dividends:main"
portfolio-build-news-archive = "agentic_portfolio.dataset.news_archive:main"
portfolio-backfill-snapshot = "agentic_portfolio.dataset.backfill_snapshot:main"
portfolio-holdings = "agentic_portfolio.flow.holdings_cli:main"
portfolio-summary = "agentic_portfolio.flow.summary_cli:main"
portfolio-migrate-candidates = "agentic_portfolio.flow.candidate_memory:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Standard src-layout: the wheel's single top-level package is `agentic_portfolio`, so an
# install never claims a generic name like `src` in the user's site-packages.
#
# The six `agents/*_crew/config/*.yaml` files ship because hatchling includes non-Python
# files found inside a `packages` directory. They MUST be in the wheel and MUST stay beside
# their crew module: CrewAI resolves `config/agents.yaml` relative to each crew module's own
# file location (`crewai/project/crew_base.py`), never relative to the working directory.
# They carry all of the LLM-S and LLM-F prompt text, so a wheel without them produces agents
# with empty configuration.
packages = ["src/agentic_portfolio"]

[tool.pytest.ini_options]
# Deliberately no `pythonpath` entry. Tests import the INSTALLED package, which `uv run`
# provides, so that a packaging mistake - a prompt YAML missing from the wheel, say - fails
# here rather than at a user. Pointing pythonpath at `src` would let the suite pass against
# a source tree that was never packaged.
