[project]
name = "agentic-portfolio"
version = "0.1.0"
description = "Agentic AI screening for portfolio investment - a CLI reproduction of arXiv:2603.23300"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Alan Hsieh" }]
keywords = ["portfolio", "finance", "llm", "crewai", "backtest", "optimization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    # Distribution is deliberately a Docker image only, so this is a hard guard:
    # PyPI refuses any upload carrying this classifier. Remove it, consciously,
    # if publishing to PyPI ever becomes the intent.
    "Private :: Do Not Upload",
]

# Exactly the ten distributions `src/agentic_portfolio/` imports, verified by parsing every
# module's import statements rather than by reading the list. Eleven others were declared and
# imported nowhere (aisuite, exa-py, markdown, matplotlib, parsel, python-dotenv, questionary,
# redis, regex, seaborn, stockstats) and `pytest` was declared as a RUNTIME dependency; all are
# now removed or moved to the dev group below. This matters for a container image, where every
# unused package is build time and image size.
#
# `weasyprint` is the tenth, and it is now imported - by
# `src/agentic_portfolio/flow/report_pdf.py`, for `portfolio-summary --pdf`. It was declared one
# commit before that module existed and was briefly the one declared-but-unimported entry here.
#
# `markdown` was deliberately NOT brought back with it, and that is worth recording because it
# looks like the obvious companion. A briefing's tables are indented by two spaces and padded
# with `str.ljust`, while CommonMark needs four spaces to make a code block - so a Markdown
# parser reads every table in the document as prose and HTML collapses the padding that IS the
# alignment. Using one would have meant writing a pre-processor that already applied the "an
# indented run is preformatted" rule, at which point the pre-processor is the converter. That
# rule lives in `src/agentic_portfolio/flow/briefing_blocks.py` and the four remaining
# constructs are emitted directly.
#
# `weasyprint` is also the only dependency here whose SYSTEM libraries are part of the contract,
# which a lock file cannot express: it dlopens Pango through cffi at IMPORT time, so both
# container images must install libpango-1.0-0, libpangoft2-1.0-0, libharfbuzz0b and
# libharfbuzz-subset0, plus fonts-dejavu-core for the tables and fonts-noto-cjk for a
# translated briefing. See the runtime stage of `Dockerfile` and `docker/Dockerfile.dev`.
# No cairo is needed - WeasyPrint has written PDF itself since v53.
#
# Only the `anthropic` crewai extra is kept. `[tools]` went because the one tool import in this
# project is `from crewai.tools import BaseTool`, which ships in crewai CORE - the separate
# `crewai-tools` distribution that the extra installs is imported nowhere. `[azure-ai-inference]`
# and `[google-genai]` went because no model in this project names those providers. `[anthropic]`
# must stay: crewai lists neither litellm nor the Anthropic SDK in its core requirements, so an
# `anthropic/claude-*` model needs it. Note this does NOT drop chromadb, which crewai core
# requires directly.
dependencies = [
    "crewai[anthropic]>=1.15.18",
    "duckdb>=1.5.2",
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.14.2",
    "pyportfolioopt>=1.6.0",
    "requests>=2.34.2",
    "weasyprint>=70.0",
    "yfinance>=1.3.0",
]

# PEP 735 dependency group, not `[project.optional-dependencies]`. `uv sync` and `uv run` install
# this group by DEFAULT, so `uv run pytest` keeps working with no flag change, while the image
# builds with `uv sync --no-dev` and gets a smaller runtime tree. An extra would have to be named
# explicitly in both places and would leak into published metadata.
#
# `cvxpy` is here because `tests/test_optimizer.py` imports it directly while nothing declared it -
# it was satisfied only transitively through pyportfolioopt, which breaks the moment that package
# changes solver backends.
# Declared after `dependencies` on purpose: a TOML sub-table ends the parent table, so
# `[project.urls]` placed above the `dependencies` list would swallow it as a URL entry.
[project.urls]
Homepage = "https://github.com/alanhsieh/agentic_portfolio"
Repository = "https://github.com/alanhsieh/agentic_portfolio"
Issues = "https://github.com/alanhsieh/agentic_portfolio/issues"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "cvxpy>=1.7",
]

[project.scripts]
portfolio = "agentic_portfolio.flow.cli:main"
portfolio-backtest = "agentic_portfolio.flow.backtest:main"
portfolio-build-membership = "agentic_portfolio.dataset.membership:main"
portfolio-build-prices = "agentic_portfolio.dataset.prices:main"
portfolio-build-fundamentals = "agentic_portfolio.dataset.fundamentals:main"
portfolio-build-momentum = "agentic_portfolio.dataset.momentum:main"
portfolio-build-returns = "agentic_portfolio.dataset.returns:main"
portfolio-build-dividends = "agentic_portfolio.dataset.dividends:main"
portfolio-build-news-archive = "agentic_portfolio.dataset.news_archive:main"
portfolio-backfill-snapshot = "agentic_portfolio.dataset.backfill_snapshot:main"
portfolio-holdings = "agentic_portfolio.flow.holdings_cli:main"
portfolio-summary = "agentic_portfolio.flow.summary_cli:main"
portfolio-migrate-candidates = "agentic_portfolio.flow.candidate_memory:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Standard src-layout: the wheel's single top-level package is `agentic_portfolio`, so an
# install never claims a generic name like `src` in the user's site-packages.
#
# The six `agents/*_crew/config/*.yaml` files ship because hatchling includes non-Python
# files found inside a `packages` directory. They MUST be in the wheel and MUST stay beside
# their crew module: CrewAI resolves `config/agents.yaml` relative to each crew module's own
# file location (`crewai/project/crew_base.py`), never relative to the working directory.
# They carry all of the LLM-S and LLM-F prompt text, so a wheel without them produces agents
# with empty configuration.
packages = ["src/agentic_portfolio"]

[tool.hatch.build.targets.sdist]
# The wheel needs only the package; a source distribution should also carry what
# makes the project reproducible and reviewable - the tests, the ExecPlans that
# record why each feature is shaped the way it is, and the data terms.
include = [
    "src",
    "tests",
    "plans",
    "README.md",
    "AGENTS.md",
    "PLANS.md",
    "CREWAI.md",
    "LICENSE",
    "NOTICE",
    "pyproject.toml",
    "uv.lock",
]

[tool.pytest.ini_options]
# Deliberately no `pythonpath` entry. Tests import the INSTALLED package, which `uv run`
# provides, so that a packaging mistake - a prompt YAML missing from the wheel, say - fails
# here rather than at a user. Pointing pythonpath at `src` would let the suite pass against
# a source tree that was never packaged.
