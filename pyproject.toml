[project]
name = "agentic-portfolio"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aisuite>=0.1.6",
    "crewai[anthropic,azure-ai-inference,google-genai,tools]>=1.15.18",
    "duckdb>=1.5.2",
    "exa-py>=2.13.0",
    "markdown>=3.10.2",
    "matplotlib>=3.10.9",
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "parsel>=1.11.0",
    "pydantic[email,timezone]>=2.12.5",
    "pydantic-settings>=2.14.2",
    "pyportfolioopt>=1.6.0",
    "pytest>=9.0.3",
    "python-dotenv>=1.2.2",
    "questionary>=2.1.1",
    "redis>=7.4.0",
    "regex>=2026.1.15",
    "requests>=2.34.2",
    "seaborn>=0.13.2",
    "stockstats>=0.6.8",
    "yfinance>=1.3.0",
]

[project.scripts]
portfolio = "src.flow.cli:main"
portfolio-backtest = "src.flow.backtest:main"
portfolio-build-membership = "src.dataset.membership:main"
portfolio-build-prices = "src.dataset.prices:main"
portfolio-build-fundamentals = "src.dataset.fundamentals:main"
portfolio-build-momentum = "src.dataset.momentum:main"
portfolio-build-returns = "src.dataset.returns:main"
portfolio-build-dividends = "src.dataset.dividends:main"
portfolio-build-news-archive = "src.dataset.news_archive:main"
portfolio-backfill-snapshot = "src.dataset.backfill_snapshot:main"
portfolio-holdings = "src.flow.holdings_cli:main"
portfolio-migrate-candidates = "src.flow.candidate_memory:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The import root is `src` itself (every module imports as `src.<package>.<module>`),
# so the wheel ships that directory as-is rather than a renamed distribution package.
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
