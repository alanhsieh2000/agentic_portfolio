sentiment_task:
  description: >
    Below are news headlines about {ticker}, published during {month}, each preceded by its
    0-based index in square brackets. For EVERY headline listed, output its index, a
    positive_probability (0 to 1), and a negative_probability (0 to 1) reflecting that single
    headline's own tone in isolation - do not let one headline's content influence your estimate
    for another. Return exactly one entry per headline listed, using the given index to identify
    each one; the order of your output does not matter, only that every index is covered exactly
    once.

    Headlines:
    {headlines}
  expected_output: >
    A HeadlineSentimentBatch containing exactly one HeadlineSentiment per headline listed above,
    each with its index, positive_probability, and negative_probability.
  agent: sentiment_agent
